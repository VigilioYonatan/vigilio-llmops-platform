# Vigilio LLMOps Platform — pgBackRest Offsite Encrypted Configuration
# IMPORTANT: A local Compose volume (`postgres_data`) is NEVER a backup.
# Repository 1 targets an independent S3-compatible object store outside the primary VPS
# with client-side AES-256-CBC encryption (`PGBACKREST_REPO1_CIPHER_PASS` injected from `/run/secrets/pgbackrest_repo_key`).

[global]
repo1-type=s3
repo1-path=/vigilio-llmops
repo1-s3-uri-style=path
repo1-s3-verify-tls=y
repo1-cipher-type=aes-256-cbc

# Retention Policy (3-2-1 Continuity Standard)
repo1-retention-full-type=count
repo1-retention-full=4
repo1-retention-diff=14
repo1-retention-archive-type=full
repo1-retention-archive=4

# Performance, Integrity & Safe Recovery Defaults
compress-type=zst
compress-level=3
start-fast=y
stop-auto=y
delta=y
archive-check=y
archive-copy=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=off
process-max=2

[global:archive-push]
compress-level=3

[global:archive-get]
process-max=2

[llmops]
pg1-path=/var/lib/postgresql/18/docker
pg1-host=postgres
pg1-port=5432
pg1-user=llmops
pg1-database=llmops
