---
global:
  resolve_timeout: 5m

route:
  receiver: vigilio-ops-default
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: vigilio-ops-critical
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: vigilio-ops-default
      repeat_interval: 6h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service", "component"]

receivers:
  - name: vigilio-ops-default
    webhook_configs:
      - url: "http://api:3000/health/live"
        send_resolved: true
        max_alerts: 20

  - name: vigilio-ops-critical
    webhook_configs:
      - url: "http://api:3000/health/live"
        send_resolved: true
        max_alerts: 20
