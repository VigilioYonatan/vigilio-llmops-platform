---
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 384
    spike_limit_mib: 96

  attributes/redact:
    actions:
      # Strip HTTP authentication, session cookies, CSRF and API keys
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: authorization
        action: delete
      - key: x-api-key
        action: delete
      - key: x-csrf-token
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.x-api-key
        action: delete
      - key: http.request.header.x_api_key
        action: delete
      - key: http.request.header.x-csrf-token
        action: delete
      - key: http.request.header.x_csrf_token
        action: delete
      # Strip raw LLM prompts, completions, PII and SQL statements
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: enduser.email
        action: delete
      - key: user.email
        action: delete
      - key: db.statement
        action: delete
      # Sanitize sensitive query tokens on URL attributes
      - key: url.query
        pattern: "(?i)(^|&)(token|access_token|refresh_token|id_token|api_key|code|state|secret|password)=[^&]*"
        action: delete
      - key: http.target
        pattern: "(?i)([?&](token|access_token|refresh_token|id_token|api_key|code|state|secret|password)=)[^&#]*"
        action: delete
      - key: url.full
        pattern: "(?i)([?&](token|access_token|refresh_token|id_token|api_key|code|state|secret|password)=)[^&#]*"
        action: delete

  transform/redact_urls:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - >-
            replace_pattern(attributes["url.full"],
            "(?i)([?&](?:token|access_token|refresh_token|id_token|api_key|code|state|secret|password)=)[^&#\\s]+",
            "$$1[REDACTED]")
          - >-
            replace_pattern(attributes["url.query"],
            "(?i)(^|&)((?:token|access_token|refresh_token|id_token|api_key|code|state|secret|password)=)[^&#\\s]+",
            "$$1$$2[REDACTED]")
          - >-
            replace_pattern(attributes["http.target"],
            "(?i)([?&](?:token|access_token|refresh_token|id_token|api_key|code|state|secret|password)=)[^&#\\s]+",
            "$$1[REDACTED]")
    log_statements:
      - context: log
        statements:
          - >-
            replace_pattern(body,
            "(?i)(bearer\\s+[a-z0-9._~+/-]+=*|sk-[a-z0-9_-]{12,}|vgl_[a-z0-9_-]{12,})",
            "[REDACTED_SECRET]")
            where IsString(body)

  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlphttp/tempo:
    endpoint: "http://tempo:4318"
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:9464"
    namespace: vigilio

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact_urls, attributes/redact, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact_urls, attributes/redact, batch]
      exporters: [otlphttp/loki]
