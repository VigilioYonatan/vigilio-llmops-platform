---
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: vigilio-llmops

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: alertmanager
    static_configs:
      - targets:
          - "alertmanager:9093"

  - job_name: otel-collector
    static_configs:
      - targets:
          - "otel-collector:9464"

  - job_name: alloy
    static_configs:
      - targets:
          - "alloy:12345"

  - job_name: loki
    static_configs:
      - targets:
          - "loki:3100"

  - job_name: tempo
    static_configs:
      - targets:
          - "tempo:3200"

  - job_name: vigilio-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - "api:3000"
