---
- name: Reload sshd
  ansible.builtin.service:
    name: "{{ vigilio_ssh_service_name }}"
    state: reloaded
  when: not ansible_check_mode

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true
  when: not ansible_check_mode

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true
  failed_when: false
  when: not ansible_check_mode
